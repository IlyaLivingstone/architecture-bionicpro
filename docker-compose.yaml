services:
  keycloak_db:
    image: postgres:14
    environment:
      POSTGRES_DB: keycloak_db
      POSTGRES_USER: keycloak_user
      POSTGRES_PASSWORD: keycloak_password
    volumes:
      - ./postgres-keycloak-data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak_user -d keycloak_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:21.1
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak_db:5432/keycloak_db
      KC_DB_USERNAME: keycloak_user
      KC_DB_PASSWORD: keycloak_password
      # Клиент и секрет для Identity Provider «Яндекс ID».
      # Реальные значения выдаёт https://oauth.yandex.ru, подставляются через .env.
      YANDEX_CLIENT_ID: ${YANDEX_CLIENT_ID:-bionicpro-yandex-client}
      YANDEX_CLIENT_SECRET: ${YANDEX_CLIENT_SECRET:-bionicpro-yandex-secret}
    command:
      - start-dev
      - --import-realm
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json
    ports:
      - "8080:8080"
    depends_on:
      keycloak_db:
        condition: service_healthy
      ldap:
        condition: service_started

  keycloak-setup:
    image: alpine:3.19
    volumes:
      - ./keycloak/setup:/setup:ro
    environment:
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_REALM: reports-realm
      LDAP_URL: ldap://ldap:389
      YANDEX_CLIENT_ID: ${YANDEX_CLIENT_ID:-}
      YANDEX_CLIENT_SECRET: ${YANDEX_CLIENT_SECRET:-}
    entrypoint: ["/bin/sh", "-c", "apk add --no-cache curl jq >/dev/null && sh /setup/configure-realm.sh"]
    depends_on:
      keycloak:
        condition: service_started
      ldap:
        condition: service_started
    restart: "no"

  ldap:
    image: osixia/openldap:1.5.0
    environment:
      LDAP_ORGANISATION: BionicPRO
      LDAP_DOMAIN: example.com
      LDAP_ADMIN_PASSWORD: admin
      LDAP_CONFIG_PASSWORD: config
      LDAP_TLS: "false"
      LDAP_REMOVE_CONFIG_AFTER_SETUP: "false"
    volumes:
      - ./ldap/bootstrap:/container/service/slapd/assets/config/bootstrap/ldif/custom
    command: --copy-service
    ports:
      - "389:389"

  auth_db:
    image: postgres:14
    environment:
      POSTGRES_DB: bionicpro_auth
      POSTGRES_USER: bionicpro
      POSTGRES_PASSWORD: bionicpro
    volumes:
      - ./postgres-auth-data:/var/lib/postgresql/data
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bionicpro -d bionicpro_auth"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "6379:6379"

  bionicpro-auth:
    build:
      context: ./bionicpro-auth
      dockerfile: Dockerfile
    environment:
      SERVER_PORT: 8081
      FRONTEND_URL: http://localhost:3000
      KEYCLOAK_BASE_URL: http://keycloak:8080
      KEYCLOAK_PUBLIC_URL: http://localhost:8080
      KEYCLOAK_REALM: reports-realm
      KEYCLOAK_CLIENT_ID: reports-frontend
      KEYCLOAK_ADMIN_CLIENT_ID: bionicpro-auth
      KEYCLOAK_ADMIN_CLIENT_SECRET: ${KEYCLOAK_AUTH_CLIENT_SECRET:-auth-service-secret-change-me}
      SESSION_TTL_SECONDS: 1800
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:-bionicpro-internal-token}
      # Ключ шифрования refresh-токенов перед записью в Redis (AES-GCM, 32 байта base64).
      TOKEN_ENCRYPTION_KEY: ${TOKEN_ENCRYPTION_KEY:-MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATASOURCE_URL: jdbc:postgresql://auth_db:5432/bionicpro_auth
      SPRING_DATASOURCE_USERNAME: bionicpro
      SPRING_DATASOURCE_PASSWORD: bionicpro
    ports:
      - "8081:8081"
    depends_on:
      keycloak:
        condition: service_started
      redis:
        condition: service_started
      auth_db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      REACT_APP_API_URL: http://localhost:8000
      REACT_APP_AUTH_URL: http://localhost:8081

  # --- источники данных для ETL -------------------------------------------------
  core_db:
    image: postgres:14
    environment:
      POSTGRES_DB: core
      POSTGRES_USER: core
      POSTGRES_PASSWORD: core
    volumes:
      - ./postgres-core-data:/var/lib/postgresql/data
      - ./core/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "5435:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U core -d core"]
      interval: 5s
      timeout: 5s
      retries: 10

  crm_db:
    image: postgres:14
    environment:
      POSTGRES_DB: crm
      POSTGRES_USER: crm
      POSTGRES_PASSWORD: crm
    # логическая репликация нужна Debezium для чтения изменений (CDC)
    command: ["postgres", "-c", "wal_level=logical", "-c", "max_replication_slots=4", "-c", "max_wal_senders=4"]
    volumes:
      - ./postgres-crm-data:/var/lib/postgresql/data
      - ./crm/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "5436:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crm -d crm"]
      interval: 5s
      timeout: 5s
      retries: 10

  # --- OLAP --------------------------------------------------------------------
  clickhouse:
    image: clickhouse/clickhouse-server:24.3
    environment:
      CLICKHOUSE_DB: reports
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: ""
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    volumes:
      - ./postgres-clickhouse-data:/var/lib/clickhouse
      - ./clickhouse/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "8123:8123"
      - "9431:9000"
    ulimits:
      nofile:
        soft: 262144
        hard: 262144

  # --- ETL ---------------------------------------------------------------------
  airflow_db:
    image: postgres:14
    environment:
      POSTGRES_DB: airflow
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
    volumes:
      - ./postgres-airflow-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow -d airflow"]
      interval: 5s
      timeout: 5s
      retries: 10

  airflow-init:
    build:
      context: ./airflow
      dockerfile: Dockerfile
    environment: &airflow-env
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow_db:5432/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
      AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "true"
      AIRFLOW_CONN_CRM_DB: postgresql://crm:crm@crm_db:5432/crm
      AIRFLOW_CONN_CORE_DB: postgresql://core:core@core_db:5432/core
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: "8123"
      CLICKHOUSE_DB: reports
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: ""
      REPORT_WINDOW_DAYS: "30"
    volumes:
      - ./airflow/dags:/opt/airflow/dags
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        airflow db migrate
        airflow users create --username admin --password admin --firstname Air --lastname Flow --role Admin --email admin@example.com || true
    depends_on:
      airflow_db:
        condition: service_healthy
    restart: "no"

  airflow-webserver:
    build:
      context: ./airflow
      dockerfile: Dockerfile
    environment: *airflow-env
    volumes:
      - ./airflow/dags:/opt/airflow/dags
    command: webserver
    ports:
      - "8088:8080"
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    build:
      context: ./airflow
      dockerfile: Dockerfile
    environment: *airflow-env
    volumes:
      - ./airflow/dags:/opt/airflow/dags
    command: scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  # --- объектное хранилище отчётов (конфигурация из репозитория спринта) --------
  minio:
    image: bitnamilegacy/minio:latest
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - ./minio-data:/bitnami/minio/data
    environment:
      MINIO_ROOT_USER: minio_user
      MINIO_ROOT_PASSWORD: minio_password
      MINIO_DEFAULT_BUCKETS: bionicpro-reports

  minio-init:
    image: bitnamilegacy/minio:latest
    depends_on:
      minio:
        condition: service_started
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        MC=/opt/bitnami/minio-client/bin/mc
        until $$MC alias set local http://minio:9000 minio_user minio_password >/dev/null 2>&1; do sleep 2; done
        $$MC mb --ignore-existing local/bionicpro-reports
        $$MC anonymous set none local/bionicpro-reports
        echo "bucket bionicpro-reports готов"
    restart: "no"

  # --- CDN ----------------------------------------------------------------------
  nginx-cdn:
    image: nginx:alpine
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx-cache:/var/cache/nginx
    ports:
      - "8082:80"
    depends_on:
      minio:
        condition: service_started

  # --- CDC: изменения CRM уходят в Kafka, оттуда в ClickHouse --------------------
  kafka:
    image: apache/kafka:3.8.1
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

  kafka-connect:
    image: quay.io/debezium/connect:2.7.3.Final
    ports:
      - "8083:8083"
    environment:
      BOOTSTRAP_SERVERS: kafka:9092
      GROUP_ID: bionicpro-connect
      CONFIG_STORAGE_TOPIC: connect_configs
      OFFSET_STORAGE_TOPIC: connect_offsets
      STATUS_STORAGE_TOPIC: connect_statuses
      CONFIG_STORAGE_REPLICATION_FACTOR: 1
      OFFSET_STORAGE_REPLICATION_FACTOR: 1
      STATUS_STORAGE_REPLICATION_FACTOR: 1
      KEY_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
    depends_on:
      kafka:
        condition: service_started
      crm_db:
        condition: service_healthy

  debezium-register:
    image: alpine:3.19
    volumes:
      - ./debezium:/debezium:ro
    environment:
      CONNECT_URL: http://kafka-connect:8083
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        apk add --no-cache curl jq >/dev/null
        until curl -sf "$$CONNECT_URL/connectors" >/dev/null 2>&1; do sleep 3; done
        sh /debezium/register-connector.sh
    depends_on:
      kafka-connect:
        condition: service_started
    restart: "no"

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    ports:
      - "8085:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: bionicpro
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    depends_on:
      kafka:
        condition: service_started

  # --- сервис отчётов -----------------------------------------------------------
  bionicpro-api:
    build:
      context: ./bionicpro-api
      dockerfile: Dockerfile
    environment:
      SERVER_PORT: 8000
      FRONTEND_URL: http://localhost:3000
      AUTH_SERVICE_URL: http://bionicpro-auth:8081
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:-bionicpro-internal-token}
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_DB: reports
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: ""
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: minio_user
      S3_SECRET_KEY: minio_password
      S3_BUCKET: bionicpro-reports
      CDN_URL: http://localhost:8082
    ports:
      - "8000:8000"
    depends_on:
      clickhouse:
        condition: service_started
      bionicpro-auth:
        condition: service_started
      minio:
        condition: service_started


